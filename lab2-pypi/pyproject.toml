[project]
name = "lab2-pypi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "andrew", email = "andrewkafrolov76@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "setuptools>=84.0.0",
    "wheel>=0.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "requests-mock>=1.12.1",
]

[project.scripts]
lab2-pypi = "lab2_pypi:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
